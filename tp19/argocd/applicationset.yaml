# TP19 partie 4 : une Application par dossier envs/* (dev, staging, prod).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: whoami
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/meryemelheni/partie-7-tp19-20.git
        revision: main
        directories:
          - path: tp19/envs/*
  template:
    metadata:
      name: "whoami-{{ .path.basename }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/meryemelheni/partie-7-tp19-20.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: "whoami-{{ .path.basename }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- if ne .path.basename "prod" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
